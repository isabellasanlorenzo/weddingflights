name: Sparks Wedding Flight Alerts

on:
  schedule:
    # Runs at 21:00 UTC on the 1st and 15th of every month.
    # This gives ~12 hours of buffer before the earliest 9 AM local window
    # (e.g. Melbourne AEST = UTC+10/11, so their 9 AM = ~22:00-23:00 UTC prev day).
    - cron: "0 21 1,15 * *"

  # Allows manual trigger from the Actions tab (useful for testing)
  workflow_dispatch:

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Install dependencies
        run: pip install -r requirements.txt resend python-dotenv

      - name: Run flight alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python alert.py
